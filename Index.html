<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Personajes Heroes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Heroes Unidos</h1>
      <h2>Lista de Heroes</h2>
    </header>
    <div class="container row">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#agregarHeroe"
        data-bs-whatever="@getbootstrap"
      >
        Añadí tu heroe Favorito aquí!
      </button>
      <nav class="navbar bg-body-tertiary">
       <div class="container-fluid">
        <form class="d-flex" role="search" id="formulario">
          <input class="form-control me-2" type="text" id="buscador" placeholder="Buscar" aria-label="Search"/>
          <button class="btn btn-outline-success" type="submit">Busca tu heroe</button>
         </form>
       </div>
      </nav>  

      <div
        class="modal fade"
        id="agregarHeroe"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h3 class="modal-title fs-5" id="exampleModalLabel">
                Formulario
              </h3>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="recipient-name" class="col-form-label"
                    >Nombre:</label
                  >
                    <input type="text" class="form-control" id="nombreHeroe" />
                </div>
                <div class="mb-3">
                 <label for="urlHeroe" class="col-form-label">Url</label>
                 <input type="url" class="form-control" id="urlHeroe" />
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary" id="btnAgregarHeroe">
                Agregar Heroe
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-2" id="rowContainer">
      <div class="col-3 my-2">
        <!-- <div class="card" style="width: 10rem">
          <img
            src="..."
            class="card-img-top"
            alt="Go"
            style="height: 150px; object-fit: contain"
          />
          <div class="card-body">
            <h5 class="card-title">Nombre</h5>
            <p class="card-text">Heroe</p>
            <a href="#" class="btn btn-primary"></a>
          </div>
        </div>
      </div> -->
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/app.js"></script>

    <footer>&copy;Derechos de autor reservados</footer>
  </body>
</html>
